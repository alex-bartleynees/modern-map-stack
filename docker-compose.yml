services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nz_map
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nz_map"]
      interval: 5s
      timeout: 5s
      retries: 10

  martin:
    image: ghcr.io/maplibre/martin:latest
    ports:
      - "7100:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgis:5432/nz_map
    volumes:
      - ./tiles:/tiles
      - ./config:/config
    command: --config /config/martin.yaml
    depends_on:
      postgis:
        condition: service_healthy

  pg_featureserv:
    image: pramsey/pg_featureserv:latest
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgis:5432/nz_map
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  pgdata:
