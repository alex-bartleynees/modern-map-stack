server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving upstreams at request time (via the
    # $-variable below) instead of at config-load time means nginx still
    # starts even if martin/pg_featureserv aren't up yet.
    resolver 127.0.0.11 valid=30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy to the internal tile/feature services so they never need
    # to be exposed to the public internet directly.
    location /tiles/ {
        set $martin_upstream http://martin:3000;
        proxy_pass $martin_upstream;
        proxy_set_header Host $host;
    }

    location /features/ {
        set $pgfs_upstream http://pg_featureserv:9000;
        proxy_pass $pgfs_upstream;
        proxy_set_header Host $host;
    }
}
